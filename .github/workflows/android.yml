name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Build and test
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Verify signing certificate
        run: |
          keytool -list -keystore config/nocturnenote-dev-debug.jks -storepass android -alias androiddebugkey -v | grep "SHA256:"
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NocturneNote-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
