name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Build and test
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest
      - name: Allow Android emulator acceleration
        if: github.event_name == 'pull_request'
        run: |
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Verify Zen mode on Android emulator
        if: github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Verify signing certificate
        run: |
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -Fi "6446ac0d787a955685c8c121c59648942c32220d9fe6634ded0bd3a0aed26370"
      - name: Verify APK application ID
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.sovai.nocturnenote'"

      # Build the release variant only on a manual workflow run or a
      # specifically marked main-branch merge, or an internal release PR for verification.
      # No extra workflow is triggered for pushes.
      - name: Build installable internal release APK
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[internal-release]')) || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'build/internal-release-apk-'))
        run: gradle --no-daemon -PnocturneInternalRelease=true :app:assembleRelease
      - name: Verify internal release signing and version
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[internal-release]')) || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'build/internal-release-apk-'))
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | tee /tmp/internal-release-signing.txt
          grep -Fi "6446ac0d787a955685c8c121c59648942c32220d9fe6634ded0bd3a0aed26370" /tmp/internal-release-signing.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.sovai.nocturnenote' versionCode='6' versionName='1.0.5'"
      - name: Upload installable internal release APK
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[internal-release]'))
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-Note-v1.0.5-internal-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NocturneNote-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
