name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Build and test
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Verify signing certificate
        run: |
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -F "64:46:AC:0D:78:7A:95:56:85:C8:C1:21:C5:96:48:94:2C:32:22:0D:9F:E6:63:4D:ED:0B:D3:A0:AE:D2:63:70"
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NocturneNote-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
